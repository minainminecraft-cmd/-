<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интересная игра</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: black;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        img { width: 100%; height: 100%; object-fit: cover; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Начальный экран с котиком (формат jpeg) -->
    <div id="start-screen">
        <img src="cat.jpeg" alt="Click to start">
        <h2 style="color: white; position: absolute; font-family: sans-serif; text-align: center; width: 100%; top: 50%; transform: translateY(-50%); text-shadow: 2px 2px 4px #000;">Кликни по котику, чтобы начать</h2>
    </div>

    <!-- Экран скримера (формат jpeg) -->
    <div id="scramer-screen" class="hidden">
        <img src="scary.jpeg" alt="BOO!">
    </div>

    <!-- Звук скримера -->
    <audio id="scream-sound" src="scream.mp3"></audio>

    <script>
        const startScreen = document.getElementById('start-screen');
        const scramerScreen = document.getElementById('scramer-screen');
        const sound = document.getElementById('scream-sound');

        startScreen.addEventListener('click', () => {
            // Прячем текст сразу после клика, чтобы друг понял, что игра "началась"
            startScreen.querySelector('h2').style.display = 'none';
            
            // Ждем 3 секунды (3000 миллисекунд) перед испугом
            setTimeout(() => {
                startScreen.classList.add('hidden');      // Прячем котика
                scramerScreen.classList.remove('hidden'); // Показываем монстра
                
                sound.volume = 1.0;                        // Громкость на максимум
                sound.play();                              // Включаем крик
                
                // Включаем жесткую вибрацию на телефоне (если поддерживается)
                if (navigator.vibrate) {
                    navigator.vibrate([500, 200, 500, 200, 800]);
                }
            }, 3000); 
        });
    </script>
</body>
</html>
